<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Receiver Registration</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<header>

    <div class="logo">
        🩸 SmartBlood
    </div>

    <nav>

        <a href="/">
            Home
        </a>

        <a href="/donor-register">
            Donate
        </a>

        <a href="/receiver-register">
            Need Blood
        </a>

        <a href="/login">
            Login
        </a>

    </nav>

</header>


<div class="form-container">

    <h1>Receiver Registration</h1>

    <p class="form-info">
        Register to find required blood
    </p>


    {% if error %}

    <div class="error">
        {{ error }}
    </div>

    {% endif %}


    <form method="POST">

        <!-- PATIENT NAME -->

        <label>Patient Name</label>

        <input
            type="text"
            name="name"
            placeholder="Enter patient name"
            pattern="[A-Za-z ]+"
            title="Patient name must contain characters and spaces only."
            required
        >


        <!-- EMAIL -->

        <label>Email</label>

        <input
            type="email"
            name="email"
            placeholder="Enter email"
            required
        >


        <!-- PASSWORD -->

        <label>Password</label>

        <input
            type="password"
            name="password"
            placeholder="Create password"
            required
        >


        <!-- BLOOD GROUP -->

        <label>Blood Group Required</label>

        <select name="blood_group" required>

            <option value="">
                Select Blood Group
            </option>

            <option>A+</option>
            <option>A-</option>
            <option>B+</option>
            <option>B-</option>
            <option>AB+</option>
            <option>AB-</option>
            <option>O+</option>
            <option>O-</option>

        </select>


        <!-- HOSPITAL -->

        <label>Hospital Name</label>

        <input
            type="text"
            name="hospital"
            placeholder="Enter hospital name"
            required
        >


        <!-- CITY -->

        <label>City</label>

        <input
            type="text"
            name="city"
            placeholder="Enter city"
            pattern="[A-Za-z ]+"
            title="City must contain characters and spaces only."
            required
        >


        <button type="submit">
            Register as Receiver
        </button>

    </form>


    <p class="bottom-text">

        Already registered?

        <!-- <a href="/login">
            Login here
        </a> -->

    </p>

</div>

</body>
</html>
