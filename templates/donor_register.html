<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Donor Registration</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<header>

    <div class="logo">
        🩸 SmartBlood
    </div>

    <nav>

        <a href="/">
            Home
        </a>

        <a href="/donor-register">
            Donate
        </a>

        <a href="/receiver-register">
            Need Blood
        </a>

        <a href="/login">
            Login
        </a>

    </nav>

</header>


<div class="form-container">

    <h1>Donor Registration</h1>

    <p class="form-info">
        Register as a blood donor
    </p>


    {% if error %}

    <div class="error">
        {{ error }}
    </div>

    {% endif %}


    <form method="POST">


        <!-- NAME -->

        <label>Full Name</label>

        <input
            type="text"
            name="name"
            placeholder="Enter your name"
            pattern="[A-Za-z ]+"
            title="Name must contain characters and spaces only."
            required
        >


        <!-- EMAIL -->

        <label>Email</label>

        <input
            type="email"
            name="email"
            placeholder="Enter email"
            required
        >


        <!-- PASSWORD -->

        <label>Password</label>

        <input
            type="password"
            name="password"
            placeholder="Create password"
            required
        >


        <!-- BLOOD GROUP -->

        <label>Blood Group</label>

        <select name="blood_group" required>

            <option value="">
                Select Blood Group
            </option>

            <option>A+</option>
            <option>A-</option>
            <option>B+</option>
            <option>B-</option>
            <option>AB+</option>
            <option>AB-</option>
            <option>O+</option>
            <option>O-</option>

        </select>


        <!-- PHONE -->

        <label>Phone Number</label>

        <input
            type="text"
            name="phone"
            placeholder="Enter 10 digit phone number"
            minlength="10"
            maxlength="10"
            pattern="[0-9]{10}"
            inputmode="numeric"
            title="Phone number must contain exactly 10 digits."
            required
        >


        <!-- CITY -->

        <label>City</label>

        <input
            type="text"
            name="city"
            placeholder="Enter city"
            pattern="[A-Za-z ]+"
            title="City must contain characters and spaces only."
            required
        >


        <!-- LAST DONATION DATE -->

        <label>
            Last Blood Donation Date
        </label>

        <input
            type="date"
            name="last_donation_date"
            required
        >

        <p class="form-info">
            Donor will be shown in matching results only
            after 3 months are completed from the last donation.
        </p>


        <!-- REGISTER BUTTON -->

        <button type="submit">
            Register as Donor
        </button>

    </form>


    <p class="bottom-text">

        Already registered?

        <!-- <a href="/login">
            Login here
        </a> -->

    </p>

</div>

</body>
</html>
